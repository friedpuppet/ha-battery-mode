[project]
name = "ha-battery-mode"
version = "0.1.1"
description = "Home Assistant integration: battery usage and charging modes for a Deye hybrid inverter (via ha-solarman)"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "pytest-homeassistant-custom-component==0.13.357",  # = Home Assistant 2026.8.3
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
